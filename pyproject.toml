[project]
name = "guavahack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["guava-sdk", "typing_extensions"]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Telemetry must be disabled before importing Guava.
"main.py" = ["E402"]
# Import main before Guava to apply that privacy configuration.
"test_main.py" = ["I001"]
"verify_live.py" = ["I001"]
