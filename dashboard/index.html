<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Draft Caseload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
  :root{
    --ground:#f5f6f8; --panel:#ffffff; --panel-2:#eef1f5; --rule:#dfe4ec;
    --ink:#161b23; --ink-dim:#5b6675; --ink-faint:#8a94a4;
    --accent:#1f6f66; --accent-soft:#cfe4e0; --accent-wash:#1f6f6614;
    --attention:#9d6716; --critical:#a8423b; --human:#3a5f96;
    --shadow:0 1px 2px rgba(20,26,34,.05), 0 4px 14px rgba(20,26,34,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0f1218; --panel:#161b23; --panel-2:#1d232d; --rule:#28303c;
      --ink:#e7ecf3; --ink-dim:#9aa5b5; --ink-faint:#6c7889;
      --accent:#57b7aa; --accent-soft:#2a5d57; --accent-wash:#57b7aa14;
      --attention:#d29a45; --critical:#d8756d; --human:#7ba3dc;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0f1218; --panel:#161b23; --panel-2:#1d232d; --rule:#28303c;
    --ink:#e7ecf3; --ink-dim:#9aa5b5; --ink-faint:#6c7889;
    --accent:#57b7aa; --accent-soft:#2a5d57; --accent-wash:#57b7aa14;
    --attention:#d29a45; --critical:#d8756d; --human:#7ba3dc;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:34px 24px 90px}
  a{color:inherit;text-decoration:none}
  a:focus-visible,summary:focus-visible,tr:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--rule)}
  .mark{font-family:Newsreader,Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.01em}
  .role{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
  .clinician{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;color:var(--ink-dim)}

  .notice{display:flex;gap:11px;margin:20px 0 26px;padding:11px 14px;
    background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--attention);
    border-radius:3px;font-size:13px;color:var(--ink-dim);box-shadow:var(--shadow)}
  .notice b{color:var(--ink);font-weight:600}
  .notice span[aria-hidden]{color:var(--attention);font-weight:600}

  .sectionlabel{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);margin:30px 0 11px;font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow)}
  .scroller{overflow-x:auto}

  table{width:100%;border-collapse:collapse;min-width:540px}
  thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:600;text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule)}
  thead th.num{text-align:right}
  tbody tr{border-bottom:1px solid var(--rule);transition:background .12s;cursor:pointer}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--accent-wash)}
  tbody tr.dormant td{color:var(--ink-faint)}
  td{padding:13px 16px;vertical-align:middle}
  td.nm{font-family:Newsreader,Georgia,serif;font-size:17px;font-weight:500;letter-spacing:-.005em}
  td.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;
    color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.focus{font-size:13.5px;color:var(--ink-dim)}

  .state{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink-faint);white-space:nowrap}
  .state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-faint)}
  .state.active{color:var(--accent)}
  .state.active::before{background:var(--accent)}

  .back{display:inline-block;font-size:13px;color:var(--ink-dim);margin-bottom:16px;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  .back:hover{color:var(--accent)}
  h1{font-family:Newsreader,Georgia,serif;font-size:34px;font-weight:500;
    letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
  .caseline{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;
    color:var(--ink-faint);margin-bottom:26px}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .quad{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
  @media (max-width:820px){
    .split,.trio{grid-template-columns:1fr}
    .quad{grid-template-columns:repeat(2,1fr)}
  }
  .pad{padding:16px 18px}
  .fieldname{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin-bottom:8px}
  .pad p{margin:0;font-size:14.5px;max-width:62ch}

  .stat .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:27px;font-weight:500;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .k{font-size:12px;color:var(--ink-faint);margin-top:5px}

  /* --- session log ------------------------------------------------------- */
  .log details{border-bottom:1px solid var(--rule)}
  .log details:last-child{border-bottom:none}
  .log summary{display:grid;grid-template-columns:auto 1fr auto;gap:16px;
    padding:14px 18px;align-items:start;cursor:pointer;list-style:none;transition:background .12s}
  .log summary::-webkit-details-marker{display:none}
  .log summary:hover{background:var(--accent-wash)}
  .log .idx{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
    color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-top:3px;min-width:30px}
  .log .note{font-size:14px}
  .log .meta{margin-top:6px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .log .when{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
    color:var(--ink-faint);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .log .when .chev{display:block;margin-top:4px;color:var(--ink-faint);transition:transform .15s}
  .log details[open] .when .chev{transform:rotate(90deg)}
  .log details[open] summary{background:var(--accent-wash)}

  .record{padding:2px 18px 20px 64px;background:var(--accent-wash)}
  .record .block{margin-top:14px}
  .record .blocklabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:600;margin-bottom:5px}
  .record p{margin:0;font-size:14px;max-width:70ch;color:var(--ink)}
  .record .followup{border-left:2px solid var(--accent-soft);padding-left:12px}
  .record .followup p{color:var(--ink-dim)}
  .record.is-safety{border-left:2px solid var(--critical)}
  @media (max-width:600px){.record{padding-left:18px}}

  .chip{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
    padding:2px 7px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-faint)}
  .chip.ai{color:var(--accent);border-color:var(--accent-soft)}
  .chip.human{color:var(--human);border-color:var(--human)}
  .chip.safety{color:var(--critical);border-color:var(--critical)}
  .chip.milestone{color:var(--attention);border-color:var(--attention)}
  .scene{font-size:12px;color:var(--ink-faint);
    font-family:"IBM Plex Mono",ui-monospace,monospace}

  .vacant{padding:52px 24px;text-align:center}
  .vacant .lead{font-family:Newsreader,Georgia,serif;font-size:19px;color:var(--ink-dim);margin-bottom:7px}
  .vacant .sub{font-size:13.5px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const frag = h => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content; };

const masthead = () =>
  '<div class="masthead">' +
    '<span class="mark">'+esc(CLINIC.product)+'</span>' +
    '<span class="role">'+esc(CLINIC.role)+'</span>' +
    '<span class="clinician">'+esc(CLINIC.clinician)+'</span>' +
  '</div>' +
  '<div class="notice"><span aria-hidden="true">▲</span><div>' +
    '<b>Demo data.</b> Every record here is invented for the Guava Build Night demo. ' +
    'No real patient information, and this page has no authentication — do not put real data in it.' +
  '</div></div>';

function roster(){
  const rows = PATIENTS.map(p => {
    const n = p.sessions.length;
    return '<tr tabindex="0" data-id="'+p.id+'"'+(n?'':' class="dormant"')+'>' +
      '<td class="nm">'+esc(p.name)+'</td>' +
      '<td class="focus">'+(p.focus ? esc(p.focus) : "No intake yet")+'</td>' +
      '<td class="num">'+(n ? n : "—")+'</td>' +
      '<td class="num">'+(n ? fmt(p.sessions[n-1].date) : "—")+'</td>' +
      '<td><span class="state '+(n?"active":"")+'">'+(n?"Active":"Dormant")+'</span></td>' +
    '</tr>';
  }).join("");

  return masthead() +
    '<div class="sectionlabel" style="margin-top:0">Caseload · '+PATIENTS.length+' patients</div>' +
    '<div class="panel scroller"><table>' +
      '<thead><tr><th>Name</th><th>Focus</th><th class="num">Sessions</th>' +
      '<th class="num">Last seen</th><th>State</th></tr></thead>' +
      '<tbody>'+rows+'</tbody>' +
    '</table></div>';
}

function sessionLog(sessions){
  return '<div class="panel log">' + sessions.slice().reverse().map(s => {
    const chips =
      '<span class="chip '+s.channel+'">'+(s.channel==="ai"?"Guava call":"Practitioner")+'</span>' +
      (s.flag==="safety" ? '<span class="chip safety">safety exit</span>' : "") +
      (s.flag==="milestone" ? '<span class="chip milestone">milestone</span>' : "") +
      '<span class="scene">'+(s.scene ? "scene "+esc(s.scene)+" · " : "")+"mode "+esc(s.mode)+'</span>';

    return '<details>' +
      '<summary>' +
        '<span class="idx">'+String(s.n).padStart(2,"0")+'</span>' +
        '<span><span class="note">'+esc(s.note)+'</span>' +
          '<span class="meta">'+chips+'</span></span>' +
        '<span class="when">'+fmt(s.date)+' · '+s.minutes+' min' +
          '<span class="chev" aria-hidden="true">›</span></span>' +
      '</summary>' +
      '<div class="record'+(s.flag==="safety"?" is-safety":"")+'">' +
        '<div class="block"><div class="blocklabel">Session note</div>' +
          '<p>'+esc(s.detail)+'</p></div>' +
        '<div class="block followup"><div class="blocklabel">Pick up next time</div>' +
          '<p>'+esc(s.followup)+'</p></div>' +
      '</div>' +
    '</details>';
  }).join("") + '</div>';
}

function detail(p){
  if(!p.sessions.length){
    return masthead() +
      '<a class="back" href="#/">← Caseload</a>' +
      '<h1>'+esc(p.name)+'</h1>' +
      '<div class="caseline">No record</div>' +
      '<div class="panel vacant"><div class="lead">No sessions yet.</div>' +
      '<div class="sub">This patient has not had an intake or a Guava call.</div></div>';
  }

  const ai = p.sessions.filter(s=>s.channel==="ai").length;
  const human = p.sessions.filter(s=>s.channel==="human").length;
  const minutes = p.sessions.reduce((a,s)=>a+s.minutes,0);

  const stats =
    '<div class="quad">' +
      '<div class="panel pad stat"><div class="v">'+p.sessions.length+'</div><div class="k">Sessions total</div></div>' +
      '<div class="panel pad stat"><div class="v" style="color:var(--accent)">'+ai+'</div><div class="k">Guava AI calls</div></div>' +
      '<div class="panel pad stat"><div class="v" style="color:var(--human)">'+human+'</div><div class="k">Practitioner sessions</div></div>' +
      '<div class="panel pad stat"><div class="v">'+minutes+'</div><div class="k">Minutes on record</div></div>' +
    '</div>';

  const scenes = '<div class="trio">' + p.scenes.map(s =>
    '<div class="panel pad"><div class="fieldname">'+esc(s.who)+'</div>' +
    '<p style="font-family:Newsreader,Georgia,serif;font-size:19px;margin-bottom:6px">'+esc(s.name)+'</p>' +
    '<p style="color:var(--ink-dim);font-size:13.5px">'+esc(s.behavior)+'</p></div>'
  ).join("") + '</div>';

  return masthead() +
    '<a class="back" href="#/">← Caseload</a>' +
    '<h1>'+esc(p.name)+'</h1>' +
    '<div class="caseline">In programme since '+fmt(p.since)+' · '+minutes+
      ' minutes across '+p.sessions.length+' sessions</div>' +
    '<div class="split">' +
      '<div class="panel pad"><div class="fieldname">Why they came</div><p>'+esc(p.came_for)+'</p></div>' +
      '<div class="panel pad"><div class="fieldname">Goal</div><p>'+esc(p.goal)+'</p></div>' +
    '</div>' +
    stats +
    '<div class="sectionlabel">Scenes rehearsed</div>' + scenes +
    '<div class="sectionlabel">Session log · open any session for the full note</div>' +
    sessionLog(p.sessions);
}

function render(){
  const id = location.hash.replace(/^#\/?/, "");
  const p = PATIENTS.find(x => x.id === id);
  const app = document.getElementById("app");
  app.replaceChildren(frag(p ? detail(p) : roster()));
  if(!p){
    app.querySelectorAll("tr[data-id]").forEach(tr => {
      const go = () => { location.hash = "#/" + tr.dataset.id; };
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", e => {
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); }
      });
    });
  }
  window.scrollTo(0,0);
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
