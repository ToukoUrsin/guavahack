<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Second Draft: how the call works</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 28px 22px; }
    h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }
    p { margin: 0; }
    figure { margin: 24px 0 12px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    svg text { fill: #fff; font-family: system-ui, sans-serif; text-anchor: middle; font-size: 16px; }
    .node { fill: #000; stroke: #fff; stroke-width: 1.5; }
    .boundary { fill: none; stroke: #444; }
    .arrow { fill: none; stroke: #fff; stroke-width: 1.8; }
    .title { font-size: 22px; font-weight: 650; }
    .small { font-size: 14px; }
    .mobile { display: none; }
    footer { border-top: 1px solid #333; padding-top: 14px; font-size: 14px; }
    footer p + p { margin-top: 8px; }
    kbd { font: 1em ui-monospace, monospace; }
    a { color: #fff; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    @media (max-width: 850px) {
      main { max-width: 500px; padding: 22px 14px; }
      h1 { font-size: 24px; }
      .desktop { display: none; }
      .mobile { display: block; }
      figure { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>How the call works</h1>
    <p>Second Draft · +1 (484) 740-8902</p>
    <figure aria-label="The call flow and personality switch">
      <svg class="desktop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="desktop-title desktop-desc">
        <title id="desktop-title">Mira to reasoning agent to fictional character, then back to Mira</title>
        <desc id="desktop-desc">Talk to Mira. Saying let's practise triggers the reasoning agent to generate a name, role, behaviour and goal. The controller validates the scene and Guava changes the persona, voice and task. Say hey coach or press zero to return to Mira's original voice and receive feedback. The conversation and saved moment stay in the same call.</desc>
        <defs>
          <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fff"/></marker>
        </defs>
        <rect class="boundary" x="8" y="8" width="984" height="280"/>

        <rect class="node" x="28" y="40" width="238" height="122"/>
        <text class="title" x="147" y="77">Mira</text>
        <text x="147" y="107">Listen + coach</text>
        <text class="small" x="147" y="137">Original voice</text>

        <path class="arrow" d="M266 101 H376" marker-end="url(#arrow-d)"/>
        <text class="small" x="323" y="71">“Let’s practise”</text>
        <text class="small" x="323" y="130">No extra yes</text>

        <rect class="node" x="380" y="40" width="238" height="122"/>
        <text class="title" x="499" y="77">Reasoning agent</text>
        <text x="499" y="107">Creates the personality</text>
        <text class="small" x="499" y="137">Name · role · behaviour · goal</text>

        <path class="arrow" d="M618 101 H728" marker-end="url(#arrow-d)"/>
        <text class="small" x="675" y="71">Launch</text>
        <text class="small" x="675" y="130">Role + voice</text>

        <rect class="node" x="732" y="40" width="240" height="122"/>
        <text class="title" x="852" y="77">Fictional character</text>
        <text x="852" y="107">Rehearse with you</text>
        <text class="small" x="852" y="137">Character voice</text>

        <path class="arrow" d="M852 162 V223 Q852 241 834 241 H165 Q147 241 147 223 V166" marker-end="url(#arrow-d)"/>
        <rect x="377" y="226" width="246" height="29" fill="#000"/>
        <text x="500" y="247">“Hey coach” / press 0</text>
        <text class="small" x="500" y="273">Restore Mira’s voice + discuss what happened</text>

        <text x="500" y="326">Same call. Shared conversation + saved moment.</text>
        <text class="small" x="500" y="360">Launch: controller validates → set_persona() + set_task()</text>
        <text class="small" x="500" y="385">Guava handles listening and speaking throughout.</text>
      </svg>

      <svg class="mobile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 718" role="img" aria-labelledby="mobile-title mobile-desc">
        <title id="mobile-title">Mira to reasoning agent to fictional character, then back to Mira</title>
        <desc id="mobile-desc">Saying let's practise launches a generated fictional personality, without another confirmation. Say hey coach or press zero to restore Mira's voice. Mira can discuss the rehearsal using the shared conversation and saved moment. The controller validates the scene before Guava changes the persona and task.</desc>
        <defs>
          <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fff"/></marker>
        </defs>
        <rect class="boundary" x="6" y="8" width="348" height="566"/>

        <rect class="node" x="90" y="32" width="248" height="110"/>
        <text class="title" x="214" y="67">Mira</text>
        <text x="214" y="97">Listen + coach</text>
        <text class="small" x="214" y="123">Original voice</text>

        <path class="arrow" d="M214 142 V231" marker-end="url(#arrow-m)"/>
        <text class="small" x="279" y="181">“Let’s practise”</text>
        <text class="small" x="279" y="204">No extra yes</text>

        <rect class="node" x="90" y="236" width="248" height="110"/>
        <text class="title" x="214" y="271">Reasoning agent</text>
        <text x="214" y="301">Creates the personality</text>
        <text class="small" x="214" y="327">Name · role · behaviour · goal</text>

        <path class="arrow" d="M214 346 V435" marker-end="url(#arrow-m)"/>
        <text x="279" y="389">Launch</text>
        <text class="small" x="279" y="412">Role + voice</text>

        <rect class="node" x="90" y="440" width="248" height="110"/>
        <text class="title" x="214" y="475">Fictional character</text>
        <text x="214" y="505">Rehearse with you</text>
        <text class="small" x="214" y="531">Character voice</text>

        <path class="arrow" d="M90 495 H52 Q38 495 38 481 V101 Q38 87 52 87 H85" marker-end="url(#arrow-m)"/>
        <text transform="translate(25 291) rotate(-90)">“Hey coach” / 0 → Mira + feedback</text>

        <text x="180" y="609">Same call. Shared context.</text>
        <text class="small" x="180" y="634">Recent turns + saved scene + exchange</text>
        <text class="small" x="180" y="669">Controller validates → Guava applies</text>
        <text class="small" x="180" y="693">set_persona() + set_task()</text>
        <text class="small" x="180" y="716">Guava listens and speaks throughout.</text>
      </svg>
    </figure>
    <footer>
      <p>“Change the character” → adjust · <kbd>1</kbd> from coach → replay · <kbd>9</kbd> → end · <kbd>*</kbd> → help</p>
      <p>Recent context, not unlimited memory. Fictional practice, not licensed therapy.</p>
      <p><a href="https://github.com/ToukoUrsin/guavahack">Project source</a></p>
    </footer>
  </main>
</body>
</html>
